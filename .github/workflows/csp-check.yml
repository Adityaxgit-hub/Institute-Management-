name: CSP Hash Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-csp-hashes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Regenerate CSP hashes
        run: npm run csp:build

      - name: Check for uncommitted CSP hash changes
        run: |
          git diff --exit-code csp-hashes.json || (echo "ERROR: csp-hashes.json is out of sync. Please run 'npm run csp:build' and commit the changes." && exit 1)
