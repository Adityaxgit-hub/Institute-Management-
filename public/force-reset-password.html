<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Set New Password | Institute Management Portal</title>
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --bg: #f4f7fb;
      --border: #dbe3ef;
      --success: #047857;
      --danger: #dc2626;
      --shadow: 0 24px 60px rgba(15,23,42,0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      background: radial-gradient(circle at top right, rgba(29,78,216,0.12), transparent 30rem),
                  linear-gradient(135deg, #f8fafc, var(--bg));
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(460px, 100%);
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px;
      box-shadow: var(--shadow);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .brand-mark {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #0f766e);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.78rem;
    }
    .brand span { font-weight: 700; color: #0f172a; }
    h2 { margin: 0 0 8px; font-size: 1.8rem; color: #0f172a; letter-spacing: -0.04em; }
    p.subtitle { margin: 0 0 28px; color: #64748b; line-height: 1.6; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: #334155; }
    input {
      width: 100%;
      height: 50px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0 16px;
      font: inherit;
      outline: none;
      margin-bottom: 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(29,78,216,0.12);
    }
    button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 26px rgba(29,78,216,0.22);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .message {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.92rem;
      display: none;
    }
    .message.success { background: #ecfdf5; color: var(--success); border: 1px solid #bbf7d0; }
    .message.error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .back-link { display: block; text-align: center; margin-top: 22px; color: #64748b; font-size: 0.92rem; }
    .back-link a { color: var(--primary); font-weight: 700; text-decoration: none; }
    #invalidState { text-align: center; display: none; }
    #invalidState h3 { color: var(--danger); }
  </style>
</head>
<body>
  <div class="card">
    <h2>Set a New Password</h2>
    <p class="subtitle">This is a temporary password. Set your own before continuing.</p>

    <label for="newPassword">New Password</label>
    <input type="password" id="newPassword" />

    <label for="confirmPassword">Confirm Password</label>
    <input type="password" id="confirmPassword" />

    <button id="resetBtn">Set Password</button>
    <div id="message" class="message"></div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById("resetBtn").addEventListener("click", submitForceReset);
    document.getElementById("newPassword").addEventListener("keypress", (e) => { if (e.key === "Enter") submitForceReset(); });
    document.getElementById("confirmPassword").addEventListener("keypress", (e) => { if (e.key === "Enter") submitForceReset(); }); 
    async function submitForceReset() {
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const msgEl = document.getElementById("message");

      if (!newPassword || newPassword.length < 6) {
        msgEl.textContent = "Password must be at least 6 characters.";
        msgEl.className = "message error";
        msgEl.style.display = "block";
        return;
      }
      if (newPassword !== confirmPassword) {
        msgEl.textContent = "Passwords do not match.";
        msgEl.className = "message error";
        msgEl.style.display = "block";
        return;
      }

      const res = await apiFetch("/force-reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ newPassword }),
      });
      const data = await res.json();

      if (res.ok) {
        const role = localStorage.getItem("role");
        if (role === "student") location.href = "student.html";
        else if (role === "faculty") location.href = "faculty.html";
        else location.href = "admin.html";
      } else {
        msgEl.textContent = data.message;
        msgEl.className = "message error";
        msgEl.style.display = "block";
      }
    }
  </script>
</body>
</html>
