<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard | Institute Management Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #1d4ed8;
        --primary-dark: #1e3a8a;
        --accent: #0f766e;
        --bg: #f3f6fb;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --text: #0f172a;
        --muted: #64748b;
        --border: #dbe3ef;
        --success: #047857;
        --danger: #b91c1c;
        --warning: #b45309;
        --shadow: 0 16px 36px rgba(15, 23, 42, 0.08);
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(14px);
      }

      .topbar-inner {
        max-width: 1280px;
        margin: auto;
        padding: 18px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-mark {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: white;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 0.78rem;
        letter-spacing: 0.04em;
        box-shadow: 0 12px 24px rgba(29, 78, 216, 0.22);
      }

      .brand h1 {
        margin: 0;
        font-size: 1.15rem;
        letter-spacing: -0.02em;
      }

      .brand span {
        display: block;
        color: var(--muted);
        font-size: 0.82rem;
        font-weight: 500;
        margin-top: 2px;
      }

      .logout {
        height: 42px;
        padding: 0 18px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: white;
        color: var(--text);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .logout:hover {
        border-color: var(--primary);
        color: var(--primary);
        box-shadow: 0 10px 22px rgba(29, 78, 216, 0.12);
      }

      .page {
        max-width: 1280px;
        margin: auto;
        padding: 32px 28px 48px;
      }

      .page-header {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 26px;
      }

      .page-header h2 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: -0.04em;
      }

      .page-header p {
        margin: 8px 0 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .tabs {
        display: flex;
        gap: 10px;
        padding: 6px;
        background: white;
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      .tab {
        height: 42px;
        padding: 0 18px;
        border: none;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .tab.active,
      .tab:hover {
        background: var(--primary);
        color: white;
      }

      .dashboard-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .card-header {
        padding: 22px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
      }

      .card-header h3 {
        margin: 0;
        font-size: 1.05rem;
        letter-spacing: -0.02em;
      }

      .card-header p {
        margin: 5px 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .record-count {
        min-width: 76px;
        height: 42px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        background: #eff6ff;
        color: var(--primary);
        font-weight: 800;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(160px, 1fr));
        gap: 16px;
        padding: 22px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-soft);
      }

      .field label {
        display: block;
        margin-bottom: 8px;
        color: #334155;
        font-size: 0.82rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .field input {
        width: 100%;
        height: 44px;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 0 14px;
        font: inherit;
        outline: none;
        background: white;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .field input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.1);
      }

      .actions {
        display: flex;
        align-items: end;
      }

      .csv-btn {
        height: 42px;
        padding: 0 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: white;
        color: var(--text);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
        white-space: nowrap;
      }

      .csv-btn:hover {
        border-color: var(--primary);
        color: var(--primary);
        box-shadow: 0 10px 22px rgba(29, 78, 216, 0.12);
      }

      .add {
        height: 44px;
        padding: 0 20px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        color: white;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        white-space: nowrap;
        box-shadow: 0 12px 22px rgba(29, 78, 216, 0.18);
      }

      .table-wrap {
        overflow-x: auto;
      }

      .filter-bar {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 16px 24px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-soft);
        flex-wrap: wrap;
      }

      .filter-bar input,
      .filter-bar select {
        height: 42px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0 14px;
        font: inherit;
        background: white;
        outline: none;
      }

      .filter-bar input {
        flex: 1;
        min-width: 200px;
      }

      .filter-bar select {
        min-width: 160px;
      }

      .pagination-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 24px;
        border-top: 1px solid var(--border);
        background: var(--surface-soft);
        flex-wrap: wrap;
      }

      .pagination-bar .page-info {
        color: var(--muted);
        font-size: 0.88rem;
      }

      .pagination-bar .page-controls {
        display: flex;
        gap: 8px;
      }

      .pagination-bar button {
        height: 36px;
        padding: 0 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .pagination-bar button:hover:not(:disabled) {
        border-color: var(--primary);
        color: var(--primary);
      }

      .pagination-bar button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 820px;
      }

      th,
      td {
        padding: 16px 18px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: middle;
        font-size: 0.92rem;
      }

      th {
        background: #f8fafc;
        color: #475569;
        font-size: 0.78rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 800;
      }

      tr:hover td {
        background: #fbfdff;
      }
      .edit {
        height: 36px;
        padding: 0 14px;
        border: 1px solid #bfdbfe;
        border-radius: 10px;
        background: #eff6ff;
        color: var(--primary);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        margin-right: 6px;
        transition: all 0.2s ease;
      }

      .edit:hover {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .delete {
        height: 36px;
        padding: 0 14px;
        border: 1px solid #fecaca;
        border-radius: 10px;
        background: #fff1f2;
        color: var(--danger);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .delete:hover {
        background: var(--danger);
        color: white;
        border-color: var(--danger);
      }

      .action-button {
        height: 36px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid transparent;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .approve {
        background: #dcfce7;
        color: #166534;
        border-color: #bbf7d0;
      }

      .approve:hover {
        background: #16a34a;
        color: white;
      }

      .reject {
        background: #fee2e2;
        color: #991b1b;
        border-color: #fecaca;
      }

      .reject:hover {
        background: #b91c1c;
        color: white;
      }

      .empty {
        padding: 42px 24px;
        text-align: center;
        color: var(--muted);
      }

      .toast {
        position: fixed;
        right: 24px;
        bottom: 24px;
        padding: 14px 18px;
        border-radius: 14px;
        background: #0f172a;
        color: white;
        box-shadow: var(--shadow);
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
        transition: all 0.25s ease;
        font-weight: 700;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .sendnotif {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 22px 24px;
        margin-bottom: 32px;
      }

      .sendnotif h2 {
        margin: 0 0 12px;
        font-size: 1.25rem;
        letter-spacing: -0.02em;
      }

      .sendnotif form {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .sendnotif input,
      .sendnotif textarea,
      .sendnotif select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 14px;
        font: inherit;
        outline: none;
        background: white;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .sendnotif input:focus,
      .sendnotif textarea:focus,
      .sendnotif select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.1);
      }

      .sendnotif button {
        align-self: flex-start;
        height: 42px;
        padding: 0 20px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(
          135deg,
          var(--primary),
          var(--primary-dark)
        );
        color: white;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        white-space: nowrap;
        box-shadow: 0 12px 22px rgba(29, 78, 216, 0.18);
      }

      @media (max-width: 1020px) {
        .page-header,
        .topbar-inner {
          align-items: flex-start;
          flex-direction: column;
        }

        .tabs {
          width: 100%;
        }

        .tab {
          flex: 1;
        }

        .form-grid {
          grid-template-columns: repeat(2, minmax(160px, 1fr));
        }
      }

      @media (max-width: 640px) {
        .page {
          padding: 24px 16px 36px;
        }

        .topbar-inner {
          padding: 16px;
        }

        .form-grid {
          grid-template-columns: 1fr;
        }
      }

      .leave-row-decided {
        opacity: 0.55;
        background: #f1f5f9 !important;
      }

      .leave-row-decided td {
        background: #f1f5f9 !important;
      }

      .status-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 6px 14px;
        border-radius: 999px;
        font-weight: 800;
        font-size: 0.8rem;
        min-width: 90px;
      }

      .status-pending {
        background: #fff7ed;
        color: var(--warning);
        border: 1px solid #fed7aa;
      }

      .status-approved {
        background: #dcfce7;
        color: var(--success);
        border: 1px solid #bbf7d0;
      }

      .status-rejected {
        background: #fee2e2;
        color: var(--danger);
        border: 1px solid #fecaca;
      }

      .leave-action-btn {
        height: 36px;
        padding: 0 14px;
        border-radius: 10px;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        border: 1px solid var(--border);
        background: white;
        margin-right: 6px;
      }

      .leave-action-btn.approve {
        border-color: #bbf7d0;
        color: var(--success);
      }

      .leave-action-btn.approve:hover {
        background: var(--success);
        color: white;
      }

      .leave-action-btn.reject {
        border-color: #fecaca;
        color: var(--danger);
      }

      .leave-action-btn.reject:hover {
        background: var(--danger);
        color: white;
      }

      .leave-action-btn[disabled] {
        cursor: not-allowed;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <div class="brand-mark">IMP</div>
          <div>
            <h1>Admin Dashboard</h1>
            <span>Institute record management</span>
          </div>
        </div>
        <button class="logout" id="logoutBtn">Logout</button>
      </div>
    </header>

    <main class="page">
      <div class="sendnotif">
        <h2>Send Notification</h2>
        <form id="notif-form">
          <input type="text" id="notif-title" placeholder="Title" required />
          <textarea
            id="notif-message"
            placeholder="Message..."
            required
            style="min-height: 100px"
          ></textarea>

          <select id="notif-target">
            <option value="all">All users</option>
            <option value="student">Students only</option>
            <option value="faculty">Faculty only</option>
            <option value="department">By Department</option>
          </select>

          <!-- Show only when "By Department" is selected -->
          <select id="notif-dept" style="display: none">
            <option value="">Select Department</option>
          </select>

          <!-- PDF attachment -->
          <div>
            <label style="font-size: 0.88rem; font-weight: 700; color: #334155"
              >Attach PDF (optional)</label
            >
            <input
              type="file"
              id="notif-pdf"
              accept="application/pdf"
              style="margin-top: 8px"
            />
          </div>

          <button type="submit">Send Notification</button>
        </form>
        <p id="notif-status" style="color: var(--success); display: none">
          Notification sent!
        </p>
      </div>

      <div class="page-header">
        <div>
          <h2>Academic Administration</h2>
          <p>
            Maintain student records, faculty records, and course catalog data.
          </p>
        </div>
        <div class="tabs">
          <button
            class="tab active"
            id="tabStudents"
            data-tab="students"
          >
            Students
          </button>
          <button class="tab" id="tabFaculty" data-tab="faculty">
            Faculty
          </button>
          <button class="tab" id="tabCourses" data-tab="courses">
            Courses
          </button>
          <button
            class="tab"
            id="tabDepartments"
            data-tab="departments"
          >
            Departments
          </button>
          <button
            class="tab"
            id="tabEnrollments"
            data-tab="enrollments"
          >
            Enrollments
          </button>
          <button class="tab" id="tabTeaches" data-tab="teaches">
            Teaches
          </button>
          <button class="tab" id="tabLeave" data-tab="leave">
            Leave Requests
          </button>
        </div>
      </div>

      <section class="dashboard-card">
        <div class="card-header">
          <div>
            <h3 id="sectionTitle">Students</h3>
            <p id="sectionDescription">View and manage registered students.</p>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            <div id="csvControls" style="display:none; gap:10px;">
              <button class="csv-btn" id="exportCsvBtn">⬇ Export CSV</button>
              <button class="csv-btn" id="importCsvBtn">⬆ Import CSV</button>
              <input
                type="file"
                id="csvFileInput"
                accept=".csv"
                style="display:none;"
              />
            </div>
            <div class="record-count" id="recordCount">0</div>
          </div>
        </div>

        <div class="form-grid" id="formContainer"></div>

        <div class="filter-bar" id="filterBar" style="display:none;">
          <input
            type="text"
            id="searchInput"
            placeholder="Search..."
          />
          <select id="deptFilter">
            <option value="">All Departments</option>
          </select>
        </div>

        <div class="table-wrap">
          <table id="dataTable"></table>
        </div>

        <div class="pagination-bar" id="paginationBar" style="display:none;">
          <span class="page-info" id="pageInfo">Page 1 of 1</span>
          <div class="page-controls">
            <button id="prevPageBtn">← Prev</button>
            <button id="nextPageBtn">Next →</button>
          </div>
        </div>
      </section>
    </main>
    <div
      id="editModal"
      style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.5); z-index:999; align-items:center; justify-content:center;"
    >
      <div
        style="background:white; border-radius:20px; padding:32px; width:min(480px,90vw); box-shadow:0 24px 60px rgba(15,23,42,0.2); max-height:85vh; overflow-y:auto;"
      >
        <h3 id="editModalTitle" style="margin:0 0 20px; font-size:1.3rem; color:#0f172a;">
          Edit Record
        </h3>
        <div id="editModalFields"></div>
        <div style="display:flex; gap:12px; margin-top:24px;">
          <button
            id="submitEditBtn"
            style="flex:1; height:46px; border:none; border-radius:12px; background:linear-gradient(135deg,#1d4ed8,#1e3a8a); color:white; font:inherit; font-weight:700; cursor:pointer;"
          >
            Save Changes
          </button>
          <button
            id="closeEditModalBtn"
            style="height:46px; padding:0 18px; border:1px solid #dbe3ef; border-radius:12px; background:white; font:inherit; cursor:pointer;"
          >
            Cancel
          </button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="/js/api.js"></script>
    <script>
      // Load departments on page load
      async function loadDepartments() {
        hideFilterBar();
        const facRes = await fetch("/admin/faculty?limit=1000");
        const { data: facData } = await facRes.json();

        renderForm(
          [
            {
              id: "dept_name",
              label: "Department Name",
              placeholder: "e.g. Electrical Engineering",
            },
          ],
          "Add Department",
        );

        const table = document.getElementById("dataTable");
        table.innerHTML =
          '<tr><td class="empty">Loading departments...</td></tr>';

        try {
          const res = await fetch("/admin/departments/full");
          const data = await res.json();
          document.getElementById("recordCount").textContent = data.length;

          if (data.length === 0) {
            table.innerHTML = `<tr><td colspan="4" class="empty">No departments found.</td></tr>`;
            return;
          }

          const facultyOptions = facData
              .map(
                (f) =>
                  `<option value="${f.faculty_Id}">${f.first_name} ${f.last_name}</option>`,
              )
              .join("");

          table.innerHTML = `
      <thead>
        <tr>
          <th>Dept ID</th>
          <th>Department Name</th>
          <th>Head of Department</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        ${data
          .map(
            (d) => `
          <tr>
            <td>${d.dept_Id}</td>
            <td>${d.dept_name}</td>
            <td>
              <select data-action="update-hod" data-dept-id="${d.dept_Id}" style="border:1px solid var(--border);border-radius:8px;padding:6px 10px;font:inherit;">
                <option value="">-- No HOD --</option>
                ${facData
                  .map(
                    (f) =>
                      `<option value="${f.faculty_Id}" ${d.HOD_Id == f.faculty_Id ? "selected" : ""}>
                    ${f.first_name} ${f.last_name}
                  </option>`,
                  )
                  .join("")}
              </select>
            </td>
            <td><button class="delete" data-action="delete-department" data-id="${d.dept_Id}">Delete</button></td>
          </tr>
        `,
          )
          .join("")}
      </tbody>`;
        } catch (e) {
          console.error(e);
          table.innerHTML =
            '<tr><td class="empty">Unable to load departments.</td></tr>';
        }
      }

      async function updateHOD(deptId, hodId) {
        try {
          const res = await apiFetch(`/admin/departments/${deptId}/hod`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ hod_Id: hodId || null }),
          });
          const data = await res.json();
          showToast(data.message || "HOD updated");
        } catch (e) {
          showToast("Unable to update HOD");
        }
      }

      async function deleteDepartment(id) {
        if (
          !confirm(
            "Delete this department? This may fail if faculty or students are linked to it.",
          )
        )
          return;
        try {
          const res = await apiFetch(`/admin/departments/${id}`, {
            method: "DELETE",
          });
          const data = await res.json();

      function showImportResults(result) {
        const lines = [
          `Imported: ${result.insertedCount} / ${result.totalRows}`,
          result.failedCount > 0
            ? `Failed: ${result.failedCount} (see below)`
            : "All rows imported successfully.",
        ];

        let details = "";
        if (result.errors && result.errors.length > 0) {
          details = result.errors
            .map((e) => `Row ${e.row ?? "-"} (${e.student_Id}): ${e.reasons.join("; ")}`)
            .join("\n");

        let credentials = "";
        if (result.created && result.created.length > 0) {
          credentials = result.created
            .map((c) => `${c.student_Id}: ${c.username} / ${c.password}`)
            .join("\n");
        }

          lines.join("\n") +
            (credentials ? "\n\nLogin credentials (save these — shown once):\n" + credentials : "") +
            (details ? "\n\nErrors:\n" + details : ""),
        );

      function renderLeaveTable(data) {
        const table = document.getElementById("dataTable");
        document.getElementById("recordCount").textContent = data.length;

        if (data.length === 0) {
          table.innerHTML = `<tr><td colspan="7" class="empty">No leave requests available.</td></tr>`;
          return;
        }

        // Pending requests first, decided ones (Approved/Rejected) pushed to the bottom.
        // Within each group, newest first (data already comes ordered by applied_on DESC).
        const sorted = [...data].sort((a, b) => {
          const aPending = a.status === "Pending" ? 0 : 1;
          const bPending = b.status === "Pending" ? 0 : 1;
          return aPending - bPending;
        });

        table.innerHTML = `
    <thead>
      <tr>
        <th>Leave ID</th>
        <th>Faculty ID</th>
        <th>Faculty Name</th>
        <th>From</th>
        <th>To</th>
        <th>Reason</th>
        <th>Status / Action</th>
      </tr>
    </thead>
    <tbody>
      ${sorted.map(renderLeaveRow).join("")}
    </tbody>
  `;
      }

      function renderLeaveRow(l) {
        const isDecided = l.status === "Approved" || l.status === "Rejected";
        const rowClass = isDecided ? "leave-row-decided" : "";

        let actionHtml;

        if (l.status === "Approved") {
          actionHtml = `<span class="status-badge status-approved">✓ Approved</span>`;
        } else if (l.status === "Rejected") {
          actionHtml = `<span class="status-badge status-rejected">✕ Rejected</span>`;
        } else {
          actionHtml = `
      <button class="leave-action-btn approve" data-action="decide-leave" data-id="${l.leave_Id}" data-status="approve">Approve</button>
      <button class="leave-action-btn reject" data-action="decide-leave" data-id="${l.leave_Id}" data-status="reject">Reject</button>
    `;
        }

        return `
    <tr class="${rowClass}">
      <td>${l.leave_Id}</td>
      <td>${l.faculty_Id}</td>
      <td>${l.first_name} ${l.last_name}</td>
      <td>${l.from_date || "-"}</td>
      <td>${l.to_date || "-"}</td>
      <td>${l.reason || "-"}</td>
      <td>${actionHtml}</td>
    </tr>
  `;
      }
      async function addRecord() {
        if (activeTab === "students") return addStudent();
        if (activeTab === "faculty") return addFaculty();
        if (activeTab === "courses") return addCourse();
        if (activeTab === "enrollments") return addEnrollment();
        if (activeTab === "departments") return addDepartment();
        if (activeTab === "teaches") return addTeach();
      }

      async function addStudent() {
        const payload = {
          student_Id: document.getElementById("student_Id").value,
          first_name: document.getElementById("first_name").value,
          last_name: document.getElementById("last_name").value,
          email: document.getElementById("email").value,
          phone: document.getElementById("phone").value,
          DOB: document.getElementById("DOB").value,
          dept_Id: document.getElementById("dept_Id").value,
        };
        try {
          const res = await apiFetch("/admin/students", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          showToast(data.message || data.error || "Student action completed");
          loadStudents();
        } catch (e) {
          console.error(e);
          showToast("Unable to add student");
        }
      }

      async function addFaculty() {
        const payload = {
          first_name: document.getElementById("faculty_first").value,
          last_name: document.getElementById("faculty_last").value,
          email: document.getElementById("faculty_email").value,
          phone: document.getElementById("faculty_phone").value,
          designation: document.getElementById("designation").value,
          dept_Id: document.getElementById("dept_Id_faculty").value,
        };
        try {
          const res = await apiFetch("/admin/faculty", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          showToast(data.message || data.error || "Faculty action completed");
          loadFaculty();
        } catch (e) {
          console.error(e);
          showToast("Unable to add faculty");
        }
      }

      async function addCourse() {
        const payload = {
          course_Id: document.getElementById("course_Id").value,
          course_name: document.getElementById("course_name").value,
          credits: document.getElementById("credits").value,
          dept_Id: document.getElementById("dept_Id_course").value,
        };
        try {
          const res = await apiFetch("/admin/courses", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          showToast(data.message || data.error || "Course action completed");
          loadCourses();
        } catch (e) {
          console.error(e);
          showToast("Unable to add course");
        }
      }

      async function addDepartment() {
        const dept_name = document.getElementById("dept_name")?.value?.trim();
        if (!dept_name) return showToast("Please enter a department name");
        try {
          const res = await apiFetch("/admin/departments", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ dept_name }),
          });
          const data = await res.json();
          showToast(data.message || data.error || "Done");
          loadDepartments();
        } catch (e) {
          showToast("Unable to add department");
        }
      }

      async function addEnrollment() {
        const payload = {
          student_Id: document.getElementById("enroll_student_Id").value.trim(),
          course_Id: document.getElementById("enroll_course_Id").value.trim(),
          semester: document.getElementById("enroll_semester").value,
          year: document.getElementById("enroll_year").value,
        };
        if (
          !payload.student_Id ||
          !payload.course_Id ||
          !payload.semester ||
          !payload.year
        )
          return showToast("Please fill all fields");
        try {
          const res = await apiFetch("/admin/enrollments", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          showToast(data.message || data.error || "Done");
          loadEnrollments();
        } catch (e) {
          showToast("Unable to enroll student");
        }
      }

      async function addTeach() {
        const payload = {
          faculty_Id: document.getElementById("teach_faculty_Id").value,
          course_Id: document.getElementById("teach_course_Id").value.trim(),
          section: document
            .getElementById("teach_section")
            .value.trim()
            .toUpperCase(),
          semester: document.getElementById("teach_semester").value,
          year: document.getElementById("teach_year").value,
        };
        if (
          !payload.faculty_Id ||
          !payload.course_Id ||
          !payload.section ||
          !payload.semester ||
          !payload.year
        )
          return showToast("Please fill all fields");
        try {
          const res = await apiFetch("/admin/teaches", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();
          showToast(data.message || data.error || "Done");
          loadTeaches();
        } catch (e) {
          showToast("Unable to create assignment");
        }
      }

      async function deleteStudent(id) {
        if (!confirm("Delete student?")) return;
        try {
          const res = await apiFetch("/admin/students/" + id, {
            method: "DELETE",
          });
          const data = await res.json();
          showToast(data.message || "Student deleted");
          loadStudents();
        } catch (e) {
          console.error(e);
          showToast("Unable to delete student");
        }
      }

      async function deleteFaculty(id) {
        if (!confirm("Delete faculty member?")) return;
        try {
          const res = await apiFetch("/admin/faculty/" + id, { method: "DELETE" });
          const data = await res.json();
          showToast(data.message || "Faculty deleted");
          loadFaculty();
        } catch (e) {
          console.error(e);
          showToast("Unable to delete faculty");
        }
      }

      async function deleteCourse(id) {
        if (!confirm("Delete course?")) return;
        try {
          const res = await apiFetch("/admin/courses/" + id, { method: "DELETE" });
          const data = await res.json();
          showToast(data.message || "Course deleted");
          loadCourses();
        } catch (e) {
          console.error(e);
          showToast("Unable to delete course");
        }
      }

      async function decideLeave(id, action) {
        const confirmed = confirm(
          action === "approve"
            ? "Approve this leave request?"
            : "Reject this leave request?",
        );
        if (!confirmed) return;

        const url = `/admin/faculty-leaves/${id}/${action}`;

        try {
          const res = await apiFetch(url, { method: "PUT" });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || "Update failed");
          showToast(action === "approve" ? "Leave approved" : "Leave rejected");
          loadLeaves();
        } catch (e) {
          console.error(e);
          showToast(e.message || "Unable to update leave request");
        }
      }

      // Event listeners and delegation
      document.getElementById("logoutBtn").addEventListener("click", logout);
      document.querySelectorAll(".tabs .tab").forEach((btn) => {
        btn.addEventListener("click", () => {
          showTab(btn.dataset.tab);
        });
      });
      document.getElementById("exportCsvBtn").addEventListener("click", exportStudentsCsv);
      document.getElementById("importCsvBtn").addEventListener("click", () => {
        document.getElementById("csvFileInput").click();
      });
      document.getElementById("csvFileInput").addEventListener("change", importStudentsCsv);
      document.getElementById("searchInput").addEventListener("input", handleSearchInput);
      document.getElementById("deptFilter").addEventListener("change", handleFilterChange);
      document.getElementById("prevPageBtn").addEventListener("click", () => {
        goToPage(tableState.page - 1);
      });
      document.getElementById("nextPageBtn").addEventListener("click", () => {
        goToPage(tableState.page + 1);
      });
      document.getElementById("submitEditBtn").addEventListener("click", submitEdit);
      document.getElementById("closeEditModalBtn").addEventListener("click", closeEditModal);

      document.getElementById("dataTable").addEventListener("click", (event) => {
        const btn = event.target.closest("button");
        if (!btn) return;

        const action = btn.dataset.action;
        const id = btn.dataset.id;

        if (action === "edit") {
          const type = btn.dataset.type;
          openEditModal(type, id);
        } else if (action === "delete-student") {
          deleteStudent(id);
        } else if (action === "delete-faculty") {
          deleteFaculty(id);
        } else if (action === "delete-course") {
          deleteCourse(id);
        } else if (action === "delete-department") {
          deleteDepartment(id);
        } else if (action === "delete-row") {
          const fnName = btn.dataset.fn;
          if (fnName === "deleteEnrollment") {
            deleteEnrollment(id);
          } else if (fnName === "deleteTeach") {
            deleteTeach(id);
          }
        } else if (action === "decide-leave") {
          const status = btn.dataset.status;
          decideLeave(id, status);
        }
      });

      document.getElementById("dataTable").addEventListener("change", (event) => {
        const select = event.target;
        if (select.tagName === "SELECT" && select.dataset.action === "update-hod") {
          const deptId = select.dataset.deptId;
          updateHOD(deptId, select.value);
        }
      });

      document.getElementById("formContainer").addEventListener("click", (event) => {
        const btn = event.target.closest("button");
        if (btn && btn.dataset.action === "add-record") {
          addRecord();
        }
      });

      window.addEventListener("load", async () => {
        try {
          const res = await fetch("/admin/departments");
          const depts = await res.json();
          const deptSelect = document.getElementById("notif-dept");
          depts.forEach((d) => {
            const opt = document.createElement("option");
            opt.value = d.dept_Id;
            opt.textContent = d.dept_name;
            deptSelect.appendChild(opt);
          });
        } catch (e) {
          console.error("Failed to load departments for notification form", e);
        }

        showTab("students");
      });
    </script>
  </body>
