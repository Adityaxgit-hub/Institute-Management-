<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Institute Management Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1d4ed8;
      --primary-dark: #1e3a8a;
      --bg: #f4f7fb;
      --border: #dbe3ef;
      --success: #047857;
      --danger: #dc2626;
      --shadow: 0 24px 60px rgba(15,23,42,0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Inter", sans-serif;
      background: radial-gradient(circle at top right, rgba(29,78,216,0.12), transparent 30rem),
                  linear-gradient(135deg, #f8fafc, var(--bg));
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(460px, 100%);
      background: white;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px;
      box-shadow: var(--shadow);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }
    .brand-mark {
      width: 42px; height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #0f766e);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 0.78rem;
    }
    .brand span { font-weight: 700; color: #0f172a; }
    h2 { margin: 0 0 8px; font-size: 1.8rem; color: #0f172a; letter-spacing: -0.04em; }
    p.subtitle { margin: 0 0 28px; color: #64748b; line-height: 1.6; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; color: #334155; }
    input {
      width: 100%;
      height: 50px;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0 16px;
      font: inherit;
      outline: none;
      margin-bottom: 18px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(29,78,216,0.12);
    }
    button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 14px 26px rgba(29,78,216,0.22);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .message {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.92rem;
      display: none;
    }
    .message.success { background: #ecfdf5; color: var(--success); border: 1px solid #bbf7d0; }
    .message.error { background: #fef2f2; color: var(--danger); border: 1px solid #fecaca; }
    .back-link { display: block; text-align: center; margin-top: 22px; color: #64748b; font-size: 0.92rem; }
    .back-link a { color: var(--primary); font-weight: 700; text-decoration: none; }
    #invalidState { text-align: center; display: none; }
    #invalidState h3 { color: var(--danger); }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-mark">IMP</div>
      <span>Institute Management Portal</span>
    </div>

    <!-- Shown if token is invalid -->
    <div id="invalidState">
      <h3>Link Expired or Invalid</h3>
      <p style="color:#64748b;">This password reset link has already been used or has expired.</p>
      <a href="login.html" style="color:var(--primary); font-weight:700;">Back to Login</a>
    </div>

    <!-- Shown if token is valid -->
    <div id="resetForm">
      <h2>Set New Password</h2>
      <p class="subtitle">Choose a strong password for your account.</p>

      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" placeholder="Enter new password" />

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Confirm new password" />

      <button id="resetBtn">Update Password</button>

      <div id="message" class="message"></div>
    </div>

    <div class="back-link">
      <a href="login.html">← Back to Login</a>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    // Extract token from URL: /reset-password.html?token=abc123
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    // If no token in URL, show invalid state immediately
    if (!token) {
      document.getElementById('resetForm').style.display = 'none';
      document.getElementById('invalidState').style.display = 'block';
    }

    async function submitReset() {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const msgEl = document.getElementById('message');
      const btn = document.getElementById('resetBtn');

      // Client-side validation
      if (!newPassword || !confirmPassword) {
        showMessage('Please fill in both fields.', 'error');
        return;
      }
      if (newPassword.length < 6) {
        showMessage('Password must be at least 6 characters.', 'error');
        return;
      }
      if (newPassword !== confirmPassword) {
        showMessage('Passwords do not match.', 'error');
        return;
      }

      btn.textContent = 'Updating...';
      btn.disabled = true;

      try {
        const res = await apiFetch('/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const data = await res.json();

        if (res.ok) {
          showMessage(data.message, 'success');
          btn.style.display = 'none';
          // Redirect to login after 2 seconds
          setTimeout(() => window.location.href = 'login.html', 2000);
        } else {
          // Token was invalid or expired
          if (res.status === 400) {
            document.getElementById('resetForm').style.display = 'none';
            document.getElementById('invalidState').style.display = 'block';
          } else {
            showMessage(data.message, 'error');
            btn.textContent = 'Update Password';
            btn.disabled = false;
          }
        }

      } catch (err) {
        showMessage('Server error. Please try again.', 'error');
        btn.textContent = 'Update Password';
        btn.disabled = false;
      }
    }

    function showMessage(text, type) {
      const msgEl = document.getElementById('message');
      msgEl.textContent = text;
      msgEl.className = 'message ' + type;
      msgEl.style.display = 'block';
    }

    document.getElementById('resetBtn').addEventListener('click', submitReset);
  </script>
</body>
</html>
